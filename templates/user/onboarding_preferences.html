<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<h2>Personalize your choices</h2>
<p>Note: Based on this preferences your game recommendations display</p>
<h5>You can select your choices or skip</h5>

<form method="post">
    {% csrf_token %}
    <h3>Genres</h3>
    <select name="genres" id="genre-select" multiple="multiple" style="width: 100%;">      
        {% for genre in genres %}
            <option value="{{ genre.id }}">{{ genre.name }}</option>
        {% endfor %}          
    </select>
    <h3>Platforms</h3>
    <select name="platforms" id="platform-select" multiple="multiple" style="width: 100%;">      
        {% for platform in platforms %}
            <option value="{{ platform.id }}">{{ platform.name }}</option>
        {% endfor %}          
    </select>
    <br>
    <h3>Player Perspective</h3>
    <select name="player_perspectives" id="player_perspective-select" multiple="multiple" style="width: 100%;">      
        {% for player_perspective in player_perspectives %}
            <option value="{{ player_perspective.id }}">{{ player_perspective.name }}</option>
        {% endfor %}          
    </select>
    <h3>Themes</h3>
    <select name="themes" id="theme-select" multiple="multiple" style="width: 100%;">      
        {% for theme in themes %}
            <option value="{{ theme.id }}">{{ theme.name }}</option>
        {% endfor %}          
    </select>
    <br>
    <div class="button-row">
       <button type="submit">Continue</button>
       <button type="submit">Skip</button>
    </div>
</form>

<style>
    .button-row{
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 20px 0;
    }
</style>

<script>
$(document).ready(function() {
    $('#genre-select').select2({
        placeholder: "Select Genres",
        allowClear: true
    });
});
$(document).ready(function() {
    $('#platform-select').select2({
        placeholder: "Select Platforms",
        allowClear: true
    });
});
$(document).ready(function() {
    $('#player_perspective-select').select2({
        placeholder: "Select Player Perspective",
        allowClear: true
    });
});
$(document).ready(function() {
    $('#theme-select').select2({
        placeholder: "Select Themes",
        allowClear: true
    });
});
</script>
